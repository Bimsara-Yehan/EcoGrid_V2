<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for the 'o' -->
  <circle cx="50" cy="30" r="12" fill="#1a1a1a" stroke="#2d5a27" stroke-width="1"/>
  
  <!-- Eco text -->
  <text x="10" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#2d5a27">
    Eco
  </text>
  
  <!-- Stylized leaf emerging from 'o' -->
  <path d="M58 20 Q68 15 78 20 Q73 25 68 23 Q63 21 58 20" 
        fill="#10b981" 
        stroke="#059669" 
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Leaf details -->
  <path d="M63 21 Q68 19 73 21" 
        fill="none" 
        stroke="#059669" 
        stroke-width="1"
        stroke-linecap="round"/>
  
  <!-- Grid text -->
  <text x="90" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#10b981">
    Grid
  </text>
  
  <!-- Subtle underline accent -->
  <line x1="10" y1="45" x2="190" y2="45" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
</svg>